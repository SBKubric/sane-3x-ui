"fillRecommendedDesc" = "هر چیزی که مقدار پیش‌فرض قابل دفاعی دارد پر می‌شود: هدف تقلید (دامنه پوششی این ورودی)، بازه پیمایش و تعداد تکرار مستندشده در mtg، یک حل‌کننده DNS-over-HTTPS، تحمل اختلاف زمانی ۵ ثانیه، سقف ۸۱۹۲ اتصال، و نشانی‌های عمومی این سرور — تا mtg هنگام راه‌اندازی آن‌ها را از سرویس بیرونی نپرسد. هر دو لایه دفاعی روشن می‌مانند. برای شما می‌ماند: میزبان و پورت پوشش (تنها زمانی لازم است که DNS دامنه پوششی مسدود باشد یا به همین سرور اشاره کند)، دو کلید PROXY protocol (تنها در پشت NGINX یا متعادل‌کننده بار)، ترجیح IP (تنها وقتی IPv6 خراب است)، اندازه پویای رکورد TLS (تنها اگر سایت تقلیدشده چنین کند) و نشانی فهرست‌های مسدودی (mtg فهرست خودش را دارد)."
"fillRecommendedDone" = "مقادیر پیشنهادی پر شد — فیلدها را بررسی و ذخیره کنید"
"defenseHint" = "همه موارد زیر اختیاری‌اند و اگر خالی بمانند در پیکربندی تولیدشده نوشته نمی‌شوند، پس mtg مقدار پیش‌فرض خود را نگه می‌دارد. این‌ها همان تنظیماتی هستند که وقتی سانسور از جست‌وجوی امضا به دسته‌بندی بر پایه رفتار می‌رسد اهمیت پیدا می‌کنند."
"frontingHost" = "میزبان پوشش"
"frontingHostDesc" = "اتصالی که در دست‌دهی FakeTLS رد شود — یک کاوشگر فعال یا هر کسی که پورت را پویش می‌کند — به کجا فرستاده شود. بدون آن mtg تنها اتصال را قطع می‌کند و همین قطع‌شدن خودش پاسخی قابل شناسایی است. به یک سایت واقعی اشاره دهید (یک NGINX محلی یا نشانی خود دامنه پوششی). خالی = mtg دامنه پوششی را از کلید محرمانه استخراج می‌کند."
"frontingHostPlaceholder" = "127.0.0.1 یا یک نام میزبان"
"frontingPort" = "پورت پوشش"
"frontingProxyProtocol" = "PROXY protocol به میزبان پوشش"
"frontingProxyProtocolDesc" = "با سایت پوششی به زبان PROXY protocol صحبت شود تا نشانی واقعی کاربر را ببیند. تنها اگر آن سایت انتظارش را دارد فعال کنید."
"proxyProtocolListener" = "پذیرش PROXY protocol"
"proxyProtocolListenerDesc" = "زمانی فعال کنید که این پروکسی پشت NGINX stream یا یک متعادل‌کننده بار TCP باشد — MTProto به همین شکل پورت ۴۴۳ را با یک سایت واقعی روی همان نشانی به اشتراک می‌گذارد. برای اتصال مستقیم فعال نکنید: دست‌دهی شکست می‌خورد."
"doppelganger" = "تقلید شکل ترافیک"
"doppelUrls" = "نشانی‌ها برای تقلید"
"doppelUrlsDesc" = "در هر خط یک نشانی HTTPS. mtg آن‌ها را می‌پیماید و تأخیر میان بسته‌هایشان را بازتولید می‌کند، پس نمای زمانی نشست دیگر شبیه پروکسی نیست و شبیه آن سایت می‌شود. دکمه ↻ دامنه پوششی را پر می‌کند؛ فایل‌های سنگین CDN آمار بهتری می‌دهند. خالی = این زیرسیستم بی‌کار می‌ماند."
"doppelUrlsFilled" = "هدف‌های تقلید پر شد"
"doppelRepeats" = "درخواست در هر دور"
"doppelRaidEach" = "فاصله میان دورها"
"doppelDrs" = "اندازه پویای رکورد TLS"
"doppelDrsDesc" = "با رکوردهای کوچک TLS آغاز و به تدریج بزرگ می‌شود، همان‌گونه که سرورهای Go و NGINX وصله‌خورده رفتار می‌کنند. بیشتر پیاده‌سازی‌ها (NGINX، Apache، OpenSSL) همیشه بزرگ‌ترین اندازه را به کار می‌برند، پس تنها اگر سایت تقلیدشده چنین می‌کند فعال کنید."
"network" = "شبکه"
"preferIp" = "ترجیح IP"
"preferIpDesc" = "mtg با کدام خانواده نشانی به تلگرام برسد. اگر مسیر IPv6 سرور خراب یا فیلتر است روی only-ipv4 ثابت کنید."
"mtgDefault" = "پیش‌فرض mtg"
"dns" = "حل‌کننده"
"dnsDesc" = "mtg دامنه پوششی را خودش حل می‌کند، نه از طریق حل‌کننده سیستم. اگر پاسخ محلی آلوده است یک نقطه پایانی DNS-over-HTTPS یا DNS-over-TLS بگذارید (https://1.1.1.1، tls://1.1.1.1). خالی = پیش‌فرض خود mtg."
"timeSkew" = "تحمل اختلاف زمان"
"timeSkewDesc" = "FakeTLS یک مهر زمانی رمزشده دارد و mtg پیام‌های بیرون این بازه را رد می‌کند — همین است که کاوش‌های بازپخش‌شده را متوقف می‌کند. تنها اگر ساعت سرور می‌لنگد افزایش دهید. پیش‌فرض ۳ ثانیه."
"concurrency" = "بیشترین اتصال"
"concurrencyDesc" = "این پروکسی چند اتصال هم‌زمان می‌پذیرد؛ بقیه رد می‌شوند. ۰ = پیش‌فرض mtg (۸۱۹۲)."
"publicIpv4" = "IPv4 عمومی"
"publicIpv6" = "IPv6 عمومی"
"publicIpDesc" = "نشانی‌های در دسترس این سرور. اگر خالی بماند mtg هنگام راه‌اندازی آن‌ها را از یک سرویس بیرونی می‌پرسد — با پر کردن، آن درخواست کلاً انجام نمی‌شود."
"autoDetect" = "تشخیص خودکار"
"filters" = "فیلترها"
"antiReplay" = "حافظه ضد بازپخش"
"antiReplayDesc" = "نخستین بایت‌های هر اتصال را به یاد می‌سپارد و تکرار را رد می‌کند؛ کاوش فعال به همین شکل بی‌اثر می‌شود. به‌طور پیش‌فرض روشن است و کمتر دلیلی برای خاموش کردنش وجود دارد."
"blocklist" = "فهرست مسدودی IP"
"blocklistDesc" = "کاربران شبکه‌های فهرست‌شده هرگز دست‌دهی نمی‌گیرند و به سایت پوششی فرستاده می‌شوند. به‌طور پیش‌فرض با FireHOL level 1 روشن است و آن فهرست شبکه‌های خصوصی را هم دارد: اگر از همان شبکه محلی وصل می‌شوید خاموشش کنید."
