"dnsIpv6" = "DNS (IPv6، برای کاربران)"
"dnsIpv6Desc" = "سرور DNS نسخه IPv6 که به کاربران داده می‌شود (وقتی IPv6 فعال است)."
"obfHint" = "یک نسل و یک پیش‌تنظیم برگزینید، «تولید» را بزنید و ذخیره کنید. تغییر مبهم‌سازی برای همه کاربران تغییر می‌کند — آن‌ها باید پیکربندی خود را دوباره وارد کنند وگرنه اتصالشان قطع می‌شود. H1-H4 یک مقدار (1.x) یا بازه‌ای مانند 100000-800000 (2.0) می‌پذیرند. نسخه 3.0 رمزگذاری سرآیند و زمان‌سنج‌های تصادفی‌شده پروتکل را می‌افزاید؛ تولید آن مجموعه 2.0 را هم بازمی‌سازد، چون محافظت سرآیند به S1-S4 به اندازه کافی بزرگ برای جای دادن nonce نیاز دارد. برنامه کاربر هم باید 3.0 را پشتیبانی کند."
"std2" = "AmneziaWG 2.0"
"std3" = "AmneziaWG 3.x"
"generate" = "تولید"
"preset" = "پیش‌تنظیم 2.0"
"presetDefault" = "متعادل"
"presetMobile" = "شبکه‌های همراه"
"notifyClients" = "اطلاع به کاربران (تلگرام)"
"notifyConfirm1" = "پیکربندی جدید همین حالا برای همه کاربران AWG متصل به تلگرام فرستاده شود؟"
"notifyConfirm2" = "این کار را پس از انتقال سرور به 2.0 انجام دهید."
"notifyDone" = "به کاربران اطلاع داده شد"
"s3Desc" = "AmneziaWG 2.0: لایه‌گذاری تصادفی برای بسته‌های Cookie (۰-۶۴). ۰ رفتار 1.x را نگه می‌دارد."
"s4Desc" = "AmneziaWG 2.0: لایه‌گذاری تصادفی برای بسته‌های داده (انتقال) (۰-۳۲). ۰ رفتار 1.x را نگه می‌دارد."
"i1Desc" = "AmneziaWG 2.0: بسته امضای CPS که پیش از هر دست‌دهی فرستاده می‌شود، مثلاً <r 128> (N بایت تصادفی). خالی رفتار 1.x را نگه می‌دارد."
"i2to5Desc" = "(I2-I5) بسته‌های امضای افزوده که پیش از دست‌دهی همراه I1 فرستاده می‌شوند. تولیدکننده به هر یک بایت‌های آغازین پروتکلی دیگر می‌دهد — QUIC، STUN، DTLS — تا آغاز جریان مانند چیزی خوانده شود که سانسور همین حالا هم از آن می‌گذرد. لازم نیست با سرور یکسان باشند: دریافت‌کننده هرگز آن‌ها را بررسی نمی‌کند. برچسب‌ها: <b 0xHEX> بایت ثابت، <r N> بایت تصادفی، <c> شمارنده، <t> مهر زمانی. فیلدهای خالی نوشته نمی‌شوند و برنامه‌ای قدیمی‌تر از AmneziaVPN 5.18 آن‌ها را نادیده می‌گیرد."
"awg3Unsupported" = "نسخه AmneziaWG این سرور برای 3.0 قدیمی است — amneziawg-tools و ماژول هسته را به‌روز کنید. نصب‌شده:"
"off" = "خاموش"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: کلید base64 با ۳۲ بایت که سرآیند بسته را رمز می‌کند (ChaCha20). تنها پارامتر 3.0 که باید در دو سو یکسان باشد — بدون آن کاربر نمی‌تواند وصل شود. S1-S4 باید کمینه ۱۲ باشند. خالی = خاموش."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: لایه‌گذاری افزوده درون بخش رمزشده. یک مقدار یا بازه‌ای مانند 8-48؛ هسته برای هر نشست مقدار تازه‌ای برمی‌گزیند. خالی = پیش‌فرض هسته."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: پس از چند ثانیه تعویض کلید آغاز شود (پیش‌فرض ۱۲۰). بازه‌ای مانند 100-130 این لحظه را برای هر نشست متفاوت می‌کند. پایین‌تر از RejectAfterTime نگه دارید."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: فاصله میان کوشش‌های دست‌دهی به ثانیه (پیش‌فرض ۵). بازه می‌پذیرد."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: پس از چند ثانیه نشست منقضی شمرده شود (پیش‌فرض ۱۸۰). بازه می‌پذیرد. باید بالاتر از RekeyAfterTime بماند."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: چند ثانیه پیش از بسته keepalive (پیش‌فرض ۱۰). بازه می‌پذیرد."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: چند کوشش دست‌دهی پیش از انصراف (پیش‌فرض ۱۸). بازه می‌پذیرد."
"randomTrailersDesc" = "AmneziaWG 3.0: دنباله‌ای تصادفی به بسته‌ها می‌افزاید تا اندازه بسته‌ها دیگر تکرار نشود."
"disableCookiesDesc" = "AmneziaWG 3.0: پاسخ‌های cookie را خاموش می‌کند. یک نوع بسته قابل شناسایی کمتر می‌شود، به بهای از دست دادن محافظت WireGuard در برابر سیل دست‌دهی."

