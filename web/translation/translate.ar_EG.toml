"doppelganger" = "محاكاة شكل حركة البيانات"
"doppelUrls" = "عناوين للمحاكاة"
"doppelUrlsDesc" = "عنوان HTTPS واحد في كل سطر. يزحف mtg إليها ويعيد إنتاج التأخيرات بين حزمها، فيتوقف التوقيت في الجلسة عن الظهور كوكيل ويبدأ بالظهور كذلك الموقع. زر ↻ يملأ نطاق التغطية؛ والملفات الكبيرة من شبكات التوزيع تعطي إحصاءات أفضل. فارغ = يبقى هذا النظام الفرعي ساكنًا."
