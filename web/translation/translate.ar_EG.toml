"recommended" = "الإعدادات المقترحة"
"fillRecommended" = "املأ القيم المقترحة"
"fillRecommendedDesc" = "يملأ كل ما له قيمة افتراضية معقولة: هدف المحاكاة (نطاق التغطية لهذا المدخل)، وفترة الزحف وعدد التكرارات الموثَّقة في mtg، ومُحلِّل DNS-over-HTTPS، وتفاوت زمني ٥ ثوانٍ، وحد ٨١٩٢ اتصالًا، وعناوين هذا الخادم العامة — حتى لا يسأل mtg خدمة خارجية عنها عند الإقلاع. تبقى طبقتا الحماية مفعَّلتين. ويُترك لك: مضيف ومنفذ التغطية (لا يلزمان إلا إذا كان DNS نطاق التغطية محجوبًا أو يشير إلى هذا الخادم نفسه)، ومفتاحا PROXY protocol (فقط خلف NGINX أو موزِّع أحمال)، وتفضيل IP (فقط إذا كان IPv6 معطوبًا)، والحجم الديناميكي لسجلات TLS (فقط إذا كان الموقع المُحاكى يفعل ذلك)، وعناوين قوائم الحجب (فـ mtg يأتي بقائمته الخاصة)."
"fillRecommendedDone" = "تم ملء القيم المقترحة — راجع الحقول ثم احفظ"
"defenseHint" = "كل ما يلي اختياري، وإذا تُرك فارغًا فلن يُكتب في الإعداد المُولَّد ويبقى mtg على قيمته الافتراضية. هذه هي المفاتيح المهمة عندما تتوقف الرقابة عن مطابقة البصمات وتبدأ التصنيف بالسلوك."
"frontingHost" = "مضيف التغطية"
"frontingHostDesc" = "إلى أين يُحوَّل اتصال يفشل في مصافحة FakeTLS — مسبار نشط، أو أي أحد يفحص المنفذ. بدونه يقطع mtg الاتصال فقط، وهذا في ذاته ردٌّ يمكن تمييزه. وجِّهه إلى موقع حقيقي (NGINX محلي، أو عنوان نطاق التغطية نفسه). فارغ = يستخرج mtg نطاق التغطية من المفتاح السري."
"frontingHostPlaceholder" = "127.0.0.1 أو اسم مضيف"
"frontingPort" = "منفذ التغطية"
"frontingProxyProtocol" = "PROXY protocol إلى مضيف التغطية"
"frontingProxyProtocolDesc" = "التحدث مع موقع التغطية بـ PROXY protocol ليرى عنوان العميل الحقيقي. لا تفعّله إلا إذا كان ذلك الموقع يتوقعه."
"proxyProtocolListener" = "اقبل PROXY protocol"
