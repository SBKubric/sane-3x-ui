"notifyConfirm2" = "Bunu sunucuyu 2.0'a geçirdikten sonra yapın."
"notifyDone" = "İstemciler bilgilendirildi"
"s3Desc" = "AmneziaWG 2.0: Cookie paketleri için rastgele dolgu (0-64). 0, 1.x davranışını korur."
"s4Desc" = "AmneziaWG 2.0: Veri (taşıma) paketleri için rastgele dolgu (0-32). 0, 1.x davranışını korur."
"i1Desc" = "AmneziaWG 2.0: her el sıkışmadan önce gönderilen CPS imza paketi, örn. <r 128> (N rastgele bayt). Boş, 1.x davranışını korur."
"i2to5Desc" = "(I2-I5) el sıkışmadan önce I1 ile birlikte gönderilen ek imza paketleri. Üretici her birine başka bir protokolün başlangıç baytlarını verir — QUIC, STUN, DTLS — böylece akışın başı sansürün zaten geçirdiği bir şey gibi okunur. Sunucuyla eşleşmeleri gerekmez; alıcı onları hiç doğrulamaz. Etiketler: <b 0xHEX> sabit baytlar, <r N> rastgele baytlar, <c> sayaç, <t> zaman damgası. Boş alanlar yazılmaz ve AmneziaVPN 5.18'den eski bir uygulama onları yok sayar."
"awg3Unsupported" = "Bu sunucudaki AmneziaWG 3.0 için çok eski — amneziawg-tools ve çekirdek modülünü güncelleyin. Kurulu:"
"off" = "kapalı"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: paket başlığını şifreleyen base64 32 baytlık anahtar (ChaCha20). İki uçta da eşleşmesi gereken tek 3.0 parametresi — bu olmadan istemci bağlanamaz. S1-S4'ün en az 12 olmasını gerektirir. Boş = kapalı."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: şifreli kısmın içindeki ek dolgu. Tek bir değer veya 8-48 gibi bir aralık; çekirdek her oturum için yeni bir değer seçer. Boş = çekirdek varsayılanı."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: anahtar yenilemenin kaç saniye sonra başlayacağı (varsayılan 120). 100-130 gibi bir aralık, anını her oturumda farklı kılar. RejectAfterTime'ın altında tutun."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: el sıkışma denemeleri arasındaki saniye (varsayılan 5). Aralık kabul eder."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: oturumun kaç saniye sonra sona ereceği (varsayılan 180). Aralık kabul eder. RekeyAfterTime'ın üstünde kalmalıdır."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: keepalive paketinden önceki saniye (varsayılan 10). Aralık kabul eder."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: vazgeçmeden önceki el sıkışma denemesi sayısı (varsayılan 18). Aralık kabul eder."
"randomTrailersDesc" = "AmneziaWG 3.0: paketlere rastgele bir kuyruk ekler, böylece paket boyutları tekrar etmez."
"disableCookiesDesc" = "AmneziaWG 3.0: cookie yanıtlarını kapatır. Tanınabilir bir paket türünü ortadan kaldırır, karşılığında WireGuard'ın el sıkışma seli korumasından vazgeçilir."

