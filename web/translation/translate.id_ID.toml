"dnsIpv6" = "DNS (IPv6, untuk klien)"
"dnsIpv6Desc" = "Server DNS IPv6 yang diberikan ke klien (dipakai saat IPv6 aktif)."
"obfHint" = "Pilih generasi dan praatur, tekan Buat, lalu Simpan. Mengubah obfuskasi mengubahnya untuk SEMUA klien — mereka harus mengimpor ulang konfigurasinya atau koneksinya terputus. H1-H4 menerima satu nilai (1.x) atau rentang seperti 100000-800000 (2.0). Versi 3.0 menambahkan enkripsi header dan pengatur waktu protokol yang diacak; membuatnya juga membuat ulang set 2.0, karena perlindungan header memerlukan S1-S4 cukup lebar untuk memuat nonce-nya. Klien memerlukan aplikasi yang mendukung 3.0."
