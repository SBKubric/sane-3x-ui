"modeOnly443Desc" = "Усе те саме, що в подвійному режимі, і на додачу решта портів закривається. Кожен інбаунд, який повідомляє ім’я сервера, переходить за 443; той, що не вміє, — відрізається. Закритим це лишиться, тільки якщо ви потім підтвердите це з панелі: не підтвердите — усе повернеться."
