"obfHint" = "Виберіть покоління та пресет, натисніть «Згенерувати» і збережіть. Зміна обфускації змінює її для ВСІХ клієнтів — їм потрібно заново імпортувати конфігурацію, інакше вони від’єднаються. H1-H4 приймають одне значення (1.x) або діапазон виду 100000-800000 (2.0). 3.0 додає шифрування заголовка та рандомізацію таймерів протоколу; під час її генерації заново створюється й набір 2.0, бо захисту заголовка потрібні S1-S4 достатнього розміру для nonce. Клієнтському застосунку потрібна підтримка 3.0."
