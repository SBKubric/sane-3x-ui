"firewallDesc" = "Що лишиться відкритим: SSH — завжди, на тому порту, який указано в конфігурації самого sshd; порт 80, на якому nginx продовжує сертифікат Let’s Encrypt і відправляє всіх інших на https; порт панелі, поки він не відданий за 443; підписки на тих самих умовах; UDP-тунелі; і DHCP, щоб сервер не втратив свою адресу. Трафік, що прийшов із тунелю, не чіпається зовсім, як і відповіді на те, що сервер запитав сам, — тож його власні DNS, оновлення й годинник працюють далі. Усе інше відповідати перестане, а після застосування панель попросить підтвердити, що вона доступна."
