[pages.inbounds.mtproto]
"hint" = "MTProto — це проксі Telegram, який запускається зовнішнім sidecar-сервісом mtg (а не Xray). Виберіть публічний порт і домен для маскування; секрет FakeTLS генерується під час збереження та передається одним посиланням Telegram."
"fakeTlsDomain" = "Домен FakeTLS"
"fakeTlsDomainRandom" = "Вибрати випадковий домен для маскування"
"secret" = "Секрет"
"route" = "Маршрутизувати через Xray"
"routeDesc" = "Підключатися до Telegram через маршрутизатор ядра замість прямого виходу. Використовуйте це, коли Telegram заблоковано на цьому сервері і ви хочете виходити через ланцюжок outbound."
"outboundTag" = "Тег outbound"
"outboundTagDesc" = "Тег outbound (або балансувальника) Xray, на який надсилати трафік Telegram цього проксі — наприклад, ланцюжок до сервера, де доступний Telegram. Залиште порожнім, щоб використовувати outbound за замовчуванням."
"defense" = "Захист від блокувань (mtg)"
"recommended" = "Рекомендовані налаштування"
"fillRecommended" = "Заповнити рекомендованими"
"fillRecommendedDesc" = "Заповнює все, що має обґрунтоване типове значення: ціль імітації (домен прикриття цього з’єднання), задокументовані в mtg інтервал обходу та кількість запитів, резолвер DNS-over-HTTPS, допуск часу 5s, межу 8192 з’єднань і публічні адреси цього сервера — щоб mtg не запитував їх у зовнішнього сервісу під час запуску. Обидва захисти залишаються увімкненими. Вручну лишаються: хост і порт прикриття (потрібні лише коли DNS домену прикриття заблоковано або він вказує на цей самий сервер), два перемикачі PROXY protocol (лише за nginx чи балансувальником), перевага IP (лише коли IPv6 зламано), динамічний розмір TLS-записів (лише якщо так робить імітований сайт) і посилання на списки блокування (у mtg є власний)."
"fillRecommendedDone" = "Рекомендовані значення заповнено — перевірте поля та збережіть"
"defenseHint" = "Усе нижче необов’язкове: порожнє поле не пишеться у згенеровану конфігурацію, і mtg лишається на власному типовому значенні. Це ті параметри, що важливі, коли цензор перестає шукати сигнатури й починає класифікувати поведінку."
"frontingHost" = "Хост прикриття"
"frontingHostDesc" = "Куди переслати з’єднання, яке не пройшло рукостискання FakeTLS — активний зондувальник або будь-хто, хто сканує порт. Без цього mtg просто розриває з’єднання, а це вже сама собою розпізнавана відповідь. Спрямуйте на справжній сайт (локальний nginx або адресу самого домену прикриття). Порожньо = mtg визначає домен прикриття з секрету."
"frontingHostPlaceholder" = "127.0.0.1 або імʼя хоста"
"frontingPort" = "Порт прикриття"
"frontingProxyProtocol" = "PROXY protocol до хоста прикриття"
"frontingProxyProtocolDesc" = "Говорити з сайтом прикриття через PROXY protocol, щоб він бачив справжню адресу клієнта. Увімкніть лише якщо той сайт цього очікує."
"proxyProtocolListener" = "Приймати PROXY protocol"
"proxyProtocolListenerDesc" = "Увімкніть, якщо цей проксі стоїть за nginx stream або TCP-балансувальником — саме так MTProto ділить порт 443 зі справжнім сайтом на одній адресі. Для прямих підключень не вмикайте: рукостискання зламається."
"doppelganger" = "Імітація форми трафіку"
"doppelUrls" = "URL для імітації"
"doppelUrlsDesc" = "По одній HTTPS-адресі в рядку. mtg обходить їх і відтворює затримки між пакетами, тож часовий профіль сесії перестає бути схожим на проксі й починає бути схожим на цей сайт. Кнопка ↻ підставляє домен прикриття; великі файли з CDN дають точнішу статистику. Порожньо = підсистема простоює."
"doppelUrlsFilled" = "Цілі імітації заповнено"
"doppelRepeats" = "Запитів за обхід"
"doppelRaidEach" = "Інтервал між обходами"
"doppelDrs" = "Динамічний розмір TLS-записів"
"doppelDrsDesc" = "Починати з малих TLS-записів і збільшувати, як роблять сервери на Go та пропатчений nginx. Більшість стеків (nginx, Apache, OpenSSL) завжди використовують максимальний розмір, тож увімкніть лише якщо так робить імітований сайт."
"network" = "Мережа"
"preferIp" = "Перевага IP"
"preferIpDesc" = "Яким сімейством адрес mtg дістається Telegram. Поставте only-ipv4, якщо маршрут IPv6 на сервері зламаний або фільтрується."
"mtgDefault" = "типове значення mtg"
"dns" = "Резолвер"
"dnsDesc" = "mtg визначає домен прикриття самостійно, а не через системний резолвер. Вкажіть точку DNS-over-HTTPS або DNS-over-TLS (https://1.1.1.1, tls://1.1.1.1), якщо локальна відповідь отруєна. Порожньо = типове значення mtg."
"timeSkew" = "Допуск розсинхронізації часу"
