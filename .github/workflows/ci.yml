name: CI

on:
    push:
        branches:
            - main
            - dev
        tags-ignore:
            - "v*"
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: Build, vet, lint and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              run: go build ./...

            # The release and the Docker image build main.go on its own, not the
            # package: a helper of package main in another file breaks them while
            # `go build ./...` stays green (v1.9.0-chain.14).
            - name: Build main.go as the release does
              run: go build -o /dev/null main.go

            - name: Vet
              run: go vet ./...

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l . | grep -v '^to-delete/' || true)
                  if [ -n "$unformatted" ]; then
                      echo "These files are not gofmt'ed:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Staticcheck
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@latest
                  staticcheck ./...

            - name: Unreachable code
              run: |
                  go install golang.org/x/tools/cmd/deadcode@latest
                  output=$(deadcode -test ./...)
                  if [ -n "$output" ]; then
                      echo "Unreachable functions:"
                      echo "$output"
                      exit 1
                  fi

            # The panel is heavily concurrent (cron jobs, WebSocket hub, xray
            # process management), so the race detector is the point of this job.
            - name: Test with the race detector
              run: go test -race -count=1 ./...
