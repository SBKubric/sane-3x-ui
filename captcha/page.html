<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #57606a; --ok: #1a7f37; --err: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17212b; --fg: #f5f5f5; --muted: #9aa4ae; --ok: #4ac26b; --err: #ff7b72; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  altcha-widget { display: block; margin: 0 0 16px; --altcha-max-width: 100%; }
  [hidden] { display: none !important; }
  #status { min-height: 1.5em; }
  #status[data-kind="ok"] { color: var(--ok); }
  #status[data-kind="error"] { color: var(--err); }
</style>
</head>
<body>
<main data-base="{{.Base}}">
  <h1>Проверка перед заявкой</h1>
  <p>Отметьте «Я не робот»: телефон решит небольшую задачу, это займёт несколько секунд.</p>
  <altcha-widget id="altcha" data-testid="captcha-widget" challengeurl="{{.Base}}challenge" customfetch="captchaFetch" hidefooter
    strings='{"label":"Я не робот","verified":"Проверено","verifying":"Проверяем…","waitAlert":"Проверяем… подождите.","error":"Не получилось, попробуйте ещё раз.","expired":"Время вышло, попробуйте ещё раз.","verificationRequired":"Нужна проверка.","ariaLinkLabel":"ALTCHA","footer":"ALTCHA","loading":"Загрузка…","reload":"Обновить"}'></altcha-widget>
  <div id="status" data-testid="captcha-status" role="status"></div>
</main>
<script src="{{.Base}}altcha.js"></script>
<script>
(function () {
  var base = document.querySelector('main').dataset.base;
  // Telegram opens a Mini App with its launch data in the fragment.
  var initData = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || '';
  var widget = document.getElementById('altcha');
  var status = document.getElementById('status');

  // The Mini App protocol's events (core.telegram.org/api/web-events).
  function tg(type, data) {
    var body = JSON.stringify(data || {});
    try {
      if (window.TelegramWebviewProxy) {
        window.TelegramWebviewProxy.postEvent(type, body);
      } else if (window.external && 'notify' in window.external) {
        window.external.notify(JSON.stringify({ eventType: type, eventData: data || {} }));
      } else if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || {} }), '*');
      }
    } catch (e) { /* not in Telegram */ }
  }
  function say(text, kind) {
    status.textContent = text;
    status.dataset.kind = kind;
  }
  var stale = '⚠️ Страница открыта не из Telegram или устарела. Откройте её снова кнопкой в боте.';
  // The challenge is made for the person's account: the widget fetches it
  // through here, with the initData that names them.
  window.captchaFetch = function (url) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData })
    }).then(function (r) {
      if (r.status === 403) say(stale, 'error');
      return r;
    });
  };

  tg('web_app_ready');
  tg('web_app_expand');
  if (!initData) {
    widget.hidden = true;
    say('Откройте эту страницу кнопкой «Пройти проверку» в чате с ботом.', 'error');
    return;
  }
  widget.addEventListener('statechange', function (ev) {
    if (!ev.detail || ev.detail.state !== 'verified') return;
    fetch(base + 'verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData, payload: ev.detail.payload })
    }).then(function (r) {
      if (r.ok) {
        widget.hidden = true;
        say('✅ Проверка пройдена. Вернитесь в чат с ботом: он попросит комментарий к заявке.', 'ok');
        setTimeout(function () { tg('web_app_close'); }, 2500);
      } else if (r.status === 403) {
        say(stale, 'error');
      } else {
        say('⚠️ Проверка не прошла, попробуйте ещё раз.', 'error');
        if (widget.reset) widget.reset();
      }
    }).catch(function () {
      say('⚠️ Нет связи с сервером, попробуйте ещё раз.', 'error');
      if (widget.reset) widget.reset();
    });
  });
})();
</script>
</body>
</html>
