# Generated by 3AX-UI. Do not edit: this file is rewritten whenever the
# front's protection is applied. Change a value in /etc/fail2ban/jail.local
# instead: fail2ban reads it after this file, and there it wins.
#
# The front's protection (#141): addresses that probe the secret paths of
# the HTTP side, or fail to log in to the panel, are banned from 80 and 443.
# SSH stays open to them, so an owner who mistyped can still get in.

[3ax-ui-probe]
enabled           = true
backend           = auto
filter            = 3ax-ui-probe
logpath           = /var/log/nginx/3ax-ui-miss.log
port              = http,https
banaction         = iptables-multiport
maxretry          = 10
findtime          = 10m
bantime           = 1h
bantime.increment = true
bantime.maxtime   = 24h
ignoreip          = 127.0.0.1/8 ::1 198.51.100.0/24 2001:db8::7 203.0.113.9
