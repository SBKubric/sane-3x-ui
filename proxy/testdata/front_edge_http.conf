# Generated by 3AX-UI. Do not edit: this file is rewritten whenever the
# nginx settings are applied. Hand-written config belongs in another file.

map $http_upgrade $threeax_connection_upgrade {
    default upgrade;
    ''      close;
}

# The limits count per client address (#141). An exempt address — loopback,
# the chain's neighbours and, on the panel, mon-server — has an empty key,
# which limit_req and limit_conn do not count at all.
geo $threeax_exempt {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    203.0.113.9 1;
}

map $threeax_exempt $threeax_limit_key {
    1       "";
    default $binary_remote_addr;
}

limit_req_zone $threeax_limit_key zone=threeax_sub:5m rate=30r/m;
limit_req_zone $threeax_limit_key zone=threeax_api:5m rate=10r/s;
limit_req_zone $threeax_limit_key zone=threeax_login:5m rate=6r/m;
limit_conn_zone $threeax_limit_key zone=threeax_conn:5m;

map $status $threeax_upstream_miss {
    ~^40[0134]$ 1;
    default     0;
}

log_format threeax_miss '$remote_addr [$time_local] miss "$request_method $request_uri" $status';
log_format threeax_limit '$remote_addr [$time_local] limit "$request_method $request_uri" $status';

server {
    listen 127.0.0.1:8082 ssl proxy_protocol default_server;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /root/cert/ip/fullchain.pem;
    ssl_certificate_key /root/cert/ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:threeax:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    access_log off;
    server_tokens off;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @threeax_limited;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # join page of edge-a
    location /join/ {
        limit_req zone=threeax_login burst=5 nodelay;
        limit_conn threeax_conn 5;
        access_log /var/log/nginx/3ax-ui-miss.log threeax_miss if=$threeax_upstream_miss;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $threeax_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # sub server of edge-a
